name: Release

# Push a tag like v0.1.0 to build and publish a release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run tests
        run: npm test

      - name: Stamp version and download URL into module.json
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          DOWNLOAD="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/module.zip"
          jq --arg v "$VERSION" --arg d "$DOWNLOAD" '.version = $v | .download = $d' module.json > module.tmp && mv module.tmp module.json
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      # The release notes are this version's section of CHANGELOG.md ("## 0.2.4"; a pre-release like
      # v0.2.4-beta.1 uses the 0.2.4 section). A full release with no section fails here, so it can't ship without notes.
      - name: Extract release notes from CHANGELOG.md
        run: |
          BASE="${VERSION%%-*}"
          awk -v v="$BASE" '$0 == "## " v { on = 1; next } on && /^## / { exit } on' CHANGELOG.md > notes.md
          if [ -z "$(tr -d '[:space:]' < notes.md)" ]; then
            if [[ "$VERSION" == *-* ]]; then
              echo "No CHANGELOG.md section for $BASE yet; this pre-release gets generated notes only."
            else
              echo "::error::CHANGELOG.md has no '## $BASE' section. Add release notes before tagging v$VERSION."
              exit 1
            fi
          fi

      - name: Build module.zip
        run: zip -r module.zip module.json scripts styles languages LICENSE README.md CHANGELOG.md

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            module.json
            module.zip
          # The changelog section comes first, then GitHub's list of merged PRs and the compare link.
          body_path: notes.md
          generate_release_notes: true
          # Tags with a suffix (v0.1.0-beta.1) become pre-releases, which don't replace "latest".
          prerelease: ${{ contains(github.ref_name, '-') }}

      # Optional: push the new version to the Foundry package listing.
      # Add the package's release token (from foundryvtt.com) as the repository secret FOUNDRY_RELEASE_TOKEN.
      - name: Publish to Foundry package listing
        env:
          FOUNDRY_RELEASE_TOKEN: ${{ secrets.FOUNDRY_RELEASE_TOKEN }}
        if: env.FOUNDRY_RELEASE_TOKEN != '' && !contains(github.ref_name, '-')
        run: |
          MANIFEST="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/module.json"
          jq -n --arg id "$(jq -r .id module.json)" --arg v "$VERSION" --arg m "$MANIFEST" \
            --arg n "https://github.com/${GITHUB_REPOSITORY}/releases/tag/${GITHUB_REF_NAME}" \
            --argjson c "$(jq .compatibility module.json)" \
            '{id: $id, release: {version: $v, manifest: $m, notes: $n, compatibility: $c}}' > payload.json
          curl --fail-with-body -X POST https://api.foundryvtt.com/_api/packages/release_version/ \
            -H "Content-Type: application/json" -H "Authorization: $FOUNDRY_RELEASE_TOKEN" \
            --data @payload.json
